  <rect x="260" y="276" width="106" height="88" rx="15" class="card"/><text x="274" y="305" class="green" font-size="21">✣</text><text x="274" y="330" class="white" font-size="20" font-weight="800">0</text><text x="274" y="348" class="muted small">Cluster Nodes</text>
