<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
<title id="title">MeshLink Dashboard</title><desc id="desc">Mobile dashboard showing node identity, peer metrics and navigation</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0e13"/><stop offset="1" stop-color="#11161d"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".24"/></filter>
 <style>
 .ui{font-family:Inter,Roboto,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
 .white{fill:#eef3f8} .muted{fill:#89929e} .cyan{fill:#09d5e8} .green{fill:#13d69a} .purple{fill:#9255ff} .orange{fill:#ffad32} .red{fill:#ff626d}
 .card{fill:#171c23;stroke:#303740;stroke-width:1} .small{font-size:11px} .body{font-size:13px} .label{font-size:10px;letter-spacing:1.7px}
 </style>
</defs>
<rect width="390" height="844" fill="url(#bg)"/>
<g class="ui">
