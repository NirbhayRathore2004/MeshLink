<svg xmlns="http://www.w3.org/2000/svg" width="691" height="1536" viewBox="0 0 691 1536">
  <title>MeshLink Mobile Dashboard UI</title>
  <desc>Editable vector recreation of the MeshLink offline peer-to-peer mesh network dashboard.</desc>
  <defs>
    <style>
      .bg{fill:#0d1117}.panel{fill:#171c22;stroke:#30363d;stroke-width:2}
      .muted{fill:#89919d;font-family:Arial,sans-serif}.white{fill:#f0f3f8;font-family:Arial,sans-serif}
      .cyan{fill:#12d5e8}.green{fill:#00d889}.purple{fill:#8750f5}.orange{fill:#ff9800}
      .mono{font-family:'Courier New',monospace;fill:#8b929d}
      .heading{font-family:Arial,sans-serif;font-weight:700;fill:#f0f3f8}
      .sub{font-family:Arial,sans-serif;fill:#8c949f}
      .line{fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="bg" width="691" height="1536"/>
  <!-- Status bar -->
  <text x="97" y="56" class="white" font-size="25" font-weight="700">4:35</text>
  <rect x="155" y="29" width="65" height="34" rx="17" fill="#19c96b"/>
  <path d="M169 45q9-10 19 0M173 49q5-6 11 0M179 53h1" class="line" stroke="#fff" stroke-width="2.5"/>
  <text x="198" y="53" fill="#fff" font-family="Arial" font-size="18" font-weight="700">1</text>
  <circle cx="245" cy="46" r="11" fill="none" stroke="#e9edf3" stroke-width="2"/>
  <rect x="240" y="41" width="10" height="9" rx="2" fill="none" stroke="#e9edf3" stroke-width="1.5"/>
  <text x="461" y="46" class="white" font-size="16" font-weight="700">909</text>
  <text x="462" y="59" class="white" font-size="10">KB/S</text>
  <text x="500" y="47" class="white" font-size="13" font-weight="700">Vo</text>
  <text x="500" y="59" class="white" font-size="10">LTE</text>
  <text x="526" y="48" class="white" font-size="15" font-weight="700">5G</text>
  <path d="M551 56V43M558 56V38M565 56V33" stroke="#e8edf3" stroke-width="3" stroke-linecap="round"/>
  <rect x="571" y="35" width="11" height="21" rx="2" fill="none" stroke="#e8edf3" stroke-width="1.8"/>
  <rect x="574" y="38" width="5" height="13" rx="1" fill="#e8edf3"/>
  <path d="M575 32h4" stroke="#e8edf3" stroke-width="2"/>
  <text x="588" y="55" class="white" font-size="20">51%</text>

  <!-- Header -->
  <text x="31" y="159" fill="#13d4e7" font-family="Arial" font-size="55" font-weight="700">MeshLink</text>
  <text x="31" y="195" class="sub" font-size="24">Offline Peer-to-Peer Mesh Net...</text>
  <rect x="398" y="100" width="262" height="111" rx="46" fill="#20252c" stroke="#30363d" stroke-width="2"/>
  <circle cx="426" cy="155" r="10" fill="#8a8d91"/>
  <text x="447" y="162" fill="#9299a3" font-family="Arial" font-size="21" font-weight="700">OFFLINE</text>
  <rect x="552" y="132" width="78" height="47" rx="24" fill="#14191f" stroke="#30363d" stroke-width="3"/>
  <circle cx="576" cy="155" r="12" fill="#929aa5"/>

  <!-- Node identity -->
  <rect x="31" y="273" width="628" height="256" rx="30" class="panel"/>
  <text x="61" y="338" class="mono" font-size="21" letter-spacing="1">THIS NODE IDENTITY</text>
  <path d="M594 330l15-15 6 6-15 15-8 2z" fill="#12d5e8"/>
  <path d="M590 340l2-8 6 6z" fill="#12d5e8"/>
  <text x="61" y="403" class="heading" font-size="42">NODE D</text>
  <rect x="61" y="429" width="569" height="70" rx="17" fill="#20252c"/>
  <text x="80" y="472" fill="#16d7e9" font-family="Arial" font-size="23">NODE-D</text>
  <g class="line" stroke="#929aa5" stroke-width="2.5">
    <rect x="584" y="450" width="20" height="25" rx="2"/>
    <path d="M590 445h19v25"/>
  </g>

  <!-- Stats -->
  <rect x="31" y="560" width="199" height="150" rx="23" class="panel"/>
  <rect x="246" y="560" width="199" height="150" rx="23" class="panel"/>
  <rect x="461" y="560" width="198" height="150" rx="23" class="panel"/>
  <!-- direct peers icon -->
  <g class="line" stroke="#12d5e8" stroke-width="3.5">
    <path d="M52 585h23v17H52zM59 607h18"/>
    <path d="M82 590h17v22H82zM87 607h7"/>
  </g>
  <text x="50" y="654" class="heading" font-size="36">0</text>
  <text x="50" y="685" class="sub" font-size="22">Direct Peers</text>
  <!-- routes icon -->
  <g class="line" stroke="#8750f5" stroke-width="3.2">
    <path d="M286 601l12-15 12 15M298 586v25M298 597l-11 12M298 597l12 12"/>
    <path d="M286 601l-3-7m3 7l7-1M310 601l-7-1m7 1l-3-7"/>
  </g>
  <text x="265" y="654" class="heading" font-size="36">0</text>
  <text x="265" y="685" class="sub" font-size="22">Mesh Routes</text>
  <!-- cluster icon -->
  <g fill="#00d889">
    <circle cx="560" cy="588" r="6"/><circle cx="543" cy="599" r="6"/><circle cx="577" cy="599" r="6"/>
    <circle cx="560" cy="610" r="6"/><circle cx="543" cy="620" r="6"/><circle cx="577" cy="620" r="6"/>
    <circle cx="560" cy="630" r="6"/><circle cx="560" cy="599" r="6"/>
  </g>
  <g stroke="#00d889" stroke-width="3">
    <path d="M560 588l-17 11 17 11 17-11-17-11M560 610l-17 10 17 10 17-10-17-10"/>
  </g>
  <text x="480" y="654" class="heading" font-size="36">0</text>
  <text x="480" y="685" class="sub" font-size="22">Cluster Nodes</text>

  <!-- Section heading -->
  <text x="39" y="769" class="mono" font-size="20" letter-spacing="1">ACTIONS &amp; NAVIGATION</text>

  <!-- Messages card -->
  <rect x="31" y="791" width="628" height="150" rx="26" class="panel"/>
  <rect x="58" y="824" width="84" height="84" rx="18" fill="#063c47"/>
  <path d="M81 847h38v29H94l-13 11z" fill="#12d5e8"/>
  <path d="M88 855h24M88 863h24M88 871h16" stroke="#063c47" stroke-width="3" stroke-linecap="round"/>
  <text x="165" y="846" class="heading" font-size="30">Messages &amp; Broadcast</text>
  <text x="165" y="875" class="sub" font-size="23">Send direct multi-hop messages or</text>
  <text x="165" y="909" class="sub" font-size="23">cluster broadcasts</text>
  <path d="M616 856l10 10-10 10" class="line" stroke="#59616b" stroke-width="3"/>

  <!-- Discovered devices -->
  <rect x="31" y="962" width="628" height="150" rx="26" class="panel"/>
  <rect x="58" y="995" width="84" height="84" rx="18" fill="#073a2d"/>
  <g class="line" stroke="#00d889" stroke-width="4">
    <path d="M79 1023h28v26H79zM75 1054h35"/>
    <path d="M114 1027h16v24h-16zM118 1047h8"/>
  </g>
  <text x="165" y="1017" class="heading" font-size="30">Discovered Devices</text>
  <text x="165" y="1046" class="sub" font-size="22">View direct neighbors, link</text>
  <text x="165" y="1077" class="sub" font-size="22">states, and manual connect</text>
  <rect x="496" y="1012" width="137" height="49" rx="13" fill="#07382f"/>
  <text x="509" y="1043" fill="#00d889" font-family="Arial" font-size="18" font-weight="700">0 discovered</text>

  <!-- Topology graph -->
  <rect x="31" y="1133" width="628" height="150" rx="26" class="panel"/>
  <rect x="58" y="1166" width="84" height="84" rx="18" fill="#292044"/>
  <g stroke="#8750f5" stroke-width="4" stroke-linecap="round">
    <path d="M100 1208l-17-14M100 1208l17-14M100 1208l-17 15M100 1208l17 15M100 1208v-25"/>
  </g>
  <g fill="#8750f5">
    <circle cx="100" cy="1208" r="8"/><circle cx="83" cy="1194" r="7"/><circle cx="117" cy="1194" r="7"/>
    <circle cx="83" cy="1223" r="7"/><circle cx="117" cy="1223" r="7"/><circle cx="100" cy="1183" r="7"/>
  </g>
  <text x="165" y="1188" class="heading" font-size="29">Network Topology Graph</text>
  <text x="165" y="1217" class="sub" font-size="22">Interactive 2D visual map of the</text>
  <text x="165" y="1248" class="sub" font-size="22">multi-hop mesh cluster</text>
  <rect x="536" y="1182" width="97" height="49" rx="13" fill="#25203d"/>
  <text x="550" y="1213" fill="#8750f5" font-family="Arial" font-size="18" font-weight="700">0 routes</text>

  <!-- College demo -->
  <rect x="31" y="1304" width="628" height="150" rx="26" class="panel"/>
  <rect x="58" y="1337" width="84" height="84" rx="18" fill="#3b2b17"/>
  <path d="M94 1363h13l-3 8 12 27H85l12-27z" fill="#ff9800"/>
  <rect x="91" y="1360" width="18" height="5" rx="2" fill="#ff9800"/>
  <text x="165" y="1359" class="heading" font-size="29">College Demo &amp; Routing Lab</text>
  <text x="165" y="1388" class="sub" font-size="22">4-node simulation, preset identities (A, B,</text>
  <text x="165" y="1419" class="sub" font-size="22">C, D) &amp; live logger</text>
  <path d="M616 1370l10 10-10 10" class="line" stroke="#59616b" stroke-width="3"/>

  <!-- Android gesture bar -->
  <rect x="262" y="1518" width="167" height="5" rx="3" fill="#92959b"/>
</svg>