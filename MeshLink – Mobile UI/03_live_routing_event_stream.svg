<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
<title id="title">Live Routing Event Stream</title><desc id="desc">Terminal-style mesh and transport event log including permission error</desc>
